services:
  - type: web
    name: boutique-accessoires-api
    runtime: node
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run prisma:seed
    startCommand: node src/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: boutique-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: boutique-db
    plan: free
    region: frankfurt
    databaseName: boutique_db
    user: boutique_user
